[package]
name = "tflow"
version = "0.1.0"
edition = "2021"
description = "Production-grade terminal text & markdown editor"
authors = ["tflow team"]

[lib]
name = "tflow"
path = "src/lib.rs"

[[bin]]
name = "tflow"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.28", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
ropey = "1.6"
pulldown-cmark = { version = "0.12", features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
notify = "7"
arboard = "3"
regex = "1"
ignore = "0.4"
unicode-width = "0.1"
futures = "0.3"
lsp-types = "0.95"
dashmap = "6"
chrono = "0.4"
parking_lot = "0.12"
dirs = "5"
nu-ansi-term = "0.50"
atty = "0.2"
git2 = "0.18"
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
